<!DOCTYPE html>
<html>
<head>
    <title>PageTurner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="home-page">
    <header class="top-bar">
        <nav class="nav-links">
        </nav>
    </header>

    <main class="page-shell">
        <section class="hero-card">
            <p class="eyebrow">Discover your next read</p>
            <h1>PageTurner helps you find books worth lingering over.</h1>
            <p class="hero-text">
                Search by title, author, genre, mood, or describe the kind of story you want.
            </p>

            <form class="search-form" action="/search" method="get">
                <input
                    type="text"
                    name="q"
                    placeholder="Try: fantasy rebellion, enemies to lovers, books like The Hunger Games"
                >
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="filter-panel">
            <div class="filter-header">
                <h2>Quick starts</h2>
            </div>

            <div class="tag-grid">
                <a class="filter-tag" href="/search?q=fantasy">Fantasy</a>
                <a class="filter-tag" href="/search?q=romance">Romance</a>
                <a class="filter-tag" href="/search?q=dystopian">Dystopian</a>
                <a class="filter-tag" href="/search?q=dark academia">Dark Academia</a>
                <a class="filter-tag" href="/search?q=found family">Found Family</a>
                <a class="filter-tag" href="/search?q=slow burn">Slow Burn</a>
                <a class="filter-tag" href="/search?q=magic school">Magic School</a>
                <a class="filter-tag" href="/search?q=political intrigue">Political Intrigue</a>
            </div>
        </section>
    </main>
</body>
</html>
