<!DOCTYPE html>
<html>
<head>
    <title>Book Search Engine</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Book Recommendation Search Engine</h1>
        <p>Search for books by title, author, genre, or mood.</p>

        <form action="/search" method="get">
            <input type="text" name="q" placeholder="Try: dark fantasy, romance, books like Harry Potter">
            <button type="submit">Search</button>
        </form>
    </div>
</body>
</html>
